    <ellipse class="orbit orbit--rev" style="transform-origin:220px 264px"
             cx="220" cy="264" rx="142.8" ry="152.32" fill="none"
             stroke="#8b949e" stroke-width="1" stroke-dasharray="28 24" opacity="0.10"/>

